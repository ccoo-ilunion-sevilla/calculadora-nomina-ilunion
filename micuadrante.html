<style>

.avb{position:fixed;inset:0;background:#0008;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}

@keyframes up{from{transform:translateY(40px);opacity:.4}}@keyframes fd{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet,.sheet-bg{animation:none}}.sug .ab2{display:inline-block;min-width:26px;font-size:11px;color:#fff;background:#1F4E8C;border-radius:4px;padding:1px 4px;text-align:center;margin-right:6px}

footer{font-size:11.5px;color:var(--tinta-2);text-align:center;padding:6px 16px 20px}
</style>

<main id="app"></main>

  <button data-t="mes"><b>▦</b>Mes</button>

<footer>Herramienta de apoyo de la Sección Sindical de CCOO. Tus datos se guardan solo en este móvil. Contrasta siempre con el cuadrante oficial.</footer>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='mc_v1',DIA=1440;
const MES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DS=['dom','lun','mar','mié','jue','vie','sáb'],DL=['L','M','X','J','V','S','D'];
let store={packs:{},pet:{},ultimo:null,ed:{},pal:{},lug:{},hx:{},fx:{},al:{d:0,c:{},v:2}},pack=null,prev=null,tab='hoy',mes=0,selDia=-1,verCambios=false,edit=false,brush=null,brushLug='',nuevoT=false,gesT=false,edT=null,rotT=false,hoja=-1;
try{store=Object.assign(store,JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(e){}
store.ed=store.ed||{};store.pal=store.pal||{};store.lug=store.lug||{};
const guardar=()=>{try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}};

/* ---------- fechas ---------- */
const nDias=y=>((y%4===0&&y%100!==0)||y%400===0)?366:365;
const dm=(y,m)=>[31,nDias(y)===366?29:28,31,30,31,30,31,31,30,31,30,31][m];
const fec=(y,i)=>new Date(Date.UTC(y,0,1+i));
const idx=(y,m,d)=>Math.round((Date.UTC(y,m,d)-Date.UTC(y,0,1))/864e5);
const fmt=(y,i)=>{const d=fec(y,i);return DS[d.getUTCDay()]+' '+String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0');};
const corto=(y,i)=>fmt(y,i).slice(4);
const hoyIdx=y=>{const n=new Date();return n.getFullYear()===y?idx(y,n.getMonth(),n.getDate()):-1;};

/* ---------- decodificación del enlace ---------- */
const b64u=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;};
async function decodificar(s){
  const tag=s.slice(0,2),bytes=b64u(s.slice(2));
  if(tag==='z.'){
    if(typeof DecompressionStream==='undefined')throw new Error('Tu navegador es muy antiguo para abrir este enlace. Actualízalo o ábrelo con Chrome/Safari recientes.');
    const buf=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
    return JSON.parse(new TextDecoder().decode(buf));
  }
  if(tag==='j.')return JSON.parse(new TextDecoder().decode(bytes));
  throw new Error('Enlace no válido.');
}
const firma=p=>p.et+'|'+p.D.join(',');
function importar(p){
  if(!p||p.v!==1||!Array.isArray(p.D)||!p.y)throw new Error('El enlace no tiene el formato esperado.');
  const act=store.packs[p.y]&&store.packs[p.y].actual;
  if(act&&act.mat&&p.mat&&act.mat!==p.mat&&!confirm('Este enlace es de otro trabajador (nº '+p.mat+') y en este móvil tienes guardado el nº '+act.mat+'. ¿Sustituirlo?'))return false;
  const e=store.packs[p.y]||{};
  if(p.ms&&act&&act.y===p.y){ // actualización de uno o varios meses: se fusiona con lo que ya tiene
    const m2=JSON.parse(JSON.stringify(act));
    p.ms.forEach(m=>{for(let d=1;d<=dm(p.y,m);d++){const i=idx(p.y,m,d);m2.D[i]=p.D[i]||'';}m2.Hm[m]=p.Hm[m];});
    m2.L=Object.assign({},act.L,p.L);
    m2.F=(act.F||[]).filter(f=>!(f[4]||[]).length||!p.ms.includes(fec(p.y,f[4][0]).getUTCMonth())).concat(p.F||[]);
    m2.Tt=Math.round(m2.Hm.reduce((a,b)=>a+b,0)*100)/100;m2.et=p.et;m2.f=p.f;m2.fe=p.fe&&p.fe.length?p.fe:m2.fe;m2.tel=p.tel||m2.tel;
    p=m2;
  }
  if(act&&firma(act)!==firma(p))e.previa=act;
  e.actual=p;store.packs[p.y]=e;store.ultimo=p.y;guardar();return true;
}
function cargarActivo(){
  const y=store.ultimo,e=y&&store.packs[y];
  pack=e?e.actual:null;prev=e?e.previa||null:null;
  if(pack){const h=hoyIdx(pack.y);mes=(h>=0&&h<nDias(pack.y))?fec(pack.y,h).getUTCMonth():0;}
}

/* ---------- información de un día ---------- */
const ALOPT=[[0,'Sin aviso'],[15,'15 min antes'],[30,'30 min antes'],[45,'45 min antes'],[60,'1 hora antes'],[90,'1 h 30 min antes'],[120,'2 horas antes'],[180,'3 horas antes']];
const alSel=(id,val,her)=>'<select id="'+id+'">'+(her?'<option value=""'+(val===undefined||val===null||val===''?' selected':'')+'>'+her+'</option>':'')+ALOPT.map(([m,t])=>'<option value="'+m+'"'+(val!==undefined&&val!==null&&val!==''&&+val===m?' selected':'')+'>'+t+'</option>').join('')+'</select>';
const alTxt=m=>(ALOPT.find(x=>x[0]===+m)||[0,m+' min antes'])[1];
const alCfg=()=>{store.al=store.al||{d:0,c:{},v:2};store.al.c=store.al.c||{};if(store.al.v!==2){store.al.d=0;store.al.v=2;}if(store.al.d===undefined)store.al.d=0;return store.al;};// sin alarma salvo que el trabajador la elija
function avisoAlarma(min,que){
  const A=alCfg();A.pend=true;guardar();if(A.noAv||!(min>0))return;
  const d=document.createElement('div');d.className='avb';d.innerHTML='<div class="av" role="dialog" aria-label="Alarma activada"><h3>⏰ Alarma activada</h3><p>'+esc(alTxt(min))+(que?' '+esc(que):'')+'.</p>'+
   '<p style="margin-top:8px"><b>Sonará en el calendario de tu móvil, no en esta app.</b> Para que funcione:</p><ol><li>Ve a la pestaña «Calendario» y pulsa «Descargar calendario».</li><li>Impórtalo en tu móvil (si ya lo tenías, borra antes el calendario anterior).</li><li>Abre un turno en el calendario y comprueba que tiene el aviso.</li></ol>'+
   '<p class="nota">iPhone: suena con el sonido de avisos de Calendario. Android: llega como notificación de Google Calendar; si no aparece, activa las notificaciones de ese calendario y vuelve a importarlo. Con el móvil en silencio solo vibra.</p>'+
   '<p style="margin-top:8px"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="av-no"> No volver a mostrar</label></p>'+
   '<p style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" data-avcal="1">Ir a Calendario</button><button class="btn" data-avok="1">Entendido</button></p></div>';
  document.body.appendChild(d);
}
function alarmaDe(p,i,x){const o=(p===pack&&store.ed[p.y]&&store.ed[p.y][i])||{};if(o.a!==undefined)return +o.a;const A=alCfg();if(x&&A.c[x.c]!==undefined)return +A.c[x.c];return +A.d;}
const esForm=c=>/^F\d*$/.test(c||'');// formación: 5 h/día salvo horario propio
const horasDe=h=>{const sg=segs(h);return sg.length?Math.round(sg.reduce((a,x)=>a+x[1]-x[0],0)/6)/10:null;};
const legG=(p,c,raw)=>{const g=p.L[c]||store.pal[c]||null;const hx=store.hx||{};if(!raw&&g&&g[0]==='T'&&p.L[c]&&hx[c])return['T',hx[c],horasDe(hx[c]),g[3]];return g;};
function info(p,i,raw){
  let c=(p.D[i]||'').trim();const o=(!raw&&p===pack&&store.ed[p.y]&&store.ed[p.y][i])||null;
  if(o&&o.c!==undefined&&o.c!=='')c=o.c==='-'?'':o.c;
  const g=c?legG(p,c,raw||p!==pack):null;let tipo=!c?'L':(g?g[0]:'?'),hor=g?g[1]:'',horas=g?g[2]:null;
  if(esForm(c)&&!hor&&horas==null)horas=5;
  if(o&&o.h){tipo='T';hor=o.h;const sg=segs(o.h);horas=sg.length?Math.round(sg.reduce((a,x)=>a+x[1]-x[0],0)/6)/10:null;if(!c)c='·';}
  const l=(o&&o.l)||(c&&(store.lug[c]||(p.lg&&p.lg[c])))||'';
  return{c,tipo,hor,horas,l,ed:!!o&&Object.keys(o).some(k=>k!=='a'),n:(o&&o.n)||''};
}
const minu=h=>{const m=h.match(/^(\d{2}):(\d{2})$/);return m?(+m[1])*60+(+m[2]):null;};
function segs(hor){
  if(!hor)return[];let prev=-1;const out=[];
  hor.split('+').forEach(p=>{const m=p.split('-');let a=minu(m[0]),b=minu(m[1]);if(a===null||b===null)return;if(a<prev)a+=DIA;if(b<=a)b+=DIA;out.push([a,b]);prev=b;});
  return out;
}
const esNoche=hor=>{const s=segs(hor);if(!s.length)return false;const a=s[0][0]%DIA;return a>=1140||a<360;};
const cls=(i)=>{const x=info(pack,i);if(x.tipo==='L')return'l';if(x.tipo==='V')return'v';if(x.tipo==='B'||x.tipo==='P')return'b';if(x.tipo==='?')return'x';if(esNoche(x.hor))return'n';const sg=segs(x.hor);return sg.length&&sg[0][0]%DIA<720?'t m':'t';};
const horTxt=hor=>hor.split('+').map(s=>s.replace('-','–')).join(' + ');
const nombreTipo={T:'Turno',L:'Libre',V:'Vacaciones',B:'Baja',P:'Permiso / otros','?':'Código sin definir'};
const descDia=(p,i)=>{const x=info(p,i);return x.tipo==='T'?(x.c==='·'?'Turno propio':'Turno '+x.c)+' · '+horTxt(x.hor)+(x.horas!==null?' ('+String(x.horas).replace('.',',')+' h)':''):(x.c?(nombreTipo[x.tipo]||x.tipo)+' ('+x.c+')':'Libre');};

const txtDia=(i,raw)=>{const r=info(pack,i,raw);return r.tipo==='T'?(r.c==='·'?'Turno propio':'Turno '+r.c)+' · '+horTxt(r.hor):(r.c?(nombreTipo[r.tipo]||r.tipo)+' ('+r.c+')':'Libre');};

const totalH=()=>propio()?Math.round(hmMes().reduce((a,b)=>a+b,0)*100)/100:pack.Tt;

}

function parseRangos(txt,y){
  const dias=new Set(),err=[],F='(\\d{1,2})[\\/.](\\d{1,2})(?:[\\/.]\\d{2,4})?';
  const re=new RegExp('^'+F+'(?:\\s*(?:-|–|a|al|hasta)\\s*'+F+')?$','i');
  String(txt||'').split(/[\n;,]+/).map(x=>x.trim()).filter(Boolean).forEach(tok=>{
    const m=tok.match(re);if(!m){err.push('«'+tok+'»: formato no válido (ej.: 15/07-31/07 o 24/12)');return;}
    const d1=+m[1],m1=+m[2]-1,d2=m[3]?+m[3]:d1,m2=m[4]?+m[4]-1:m1,ok=(d,mm)=>mm>=0&&mm<12&&d>=1&&d<=dm(y,mm);
    if(!ok(d1,m1)||!ok(d2,m2)){err.push('«'+tok+'»: fecha inexistente');return;}
    const a=idx(y,m1,d1),b=idx(y,m2,d2);if(b<a){err.push('«'+tok+'»: el final es anterior al inicio');return;}
    for(let i=a;i<=b;i++)dias.add(i);
  });
  return{dias,err};
}
const rangos=arr=>{const a=[...arr].sort((p,q)=>p-q),o=[];a.forEach(i=>{const l=o[o.length-1];if(l&&i===l[1]+1)l[1]=i;else o.push([i,i]);});return o;};

function proximos(n){
  const y=pack.y,N=nDias(y),h=hoyIdx(y),ahora=new Date(),ahoraMin=ahora.getHours()*60+ahora.getMinutes();
  const out=[];for(let i=Math.max(0,h<0?0:h);i<N&&out.length<n;i++){
    const x=info(pack,i);if(x.tipo!=='T')continue;
    const s=segs(x.hor);const fin=i===h&&s.length?s[s.length-1][1]:DIA;
    if(i===h&&fin<=ahoraMin)continue;out.push(i);
  }return out;
}

function abLug(l){{const k=normL(l.replace(/^(estaci[oó]n|est\.?)\s+/i,'').trim());if(typeof LUG_AB_F!=='undefined'){const m=LUG_AB_F();if(m[k])return m[k];}}const w=l.replace(/^(estaci[oó]n|est\.?)\s+/i,'').replace(/\(.*?\)/g,'').split(/[\s\-]+/).filter(x=>x&&!/^(de|del|la|las|los|el|y)$/i.test(x));
  if(!w.length)return'';if(/^[A-Z0-9]{2,}$/.test(w[0]))return w[0].slice(0,4);if(w.length===1)return w[0].slice(0,3).toUpperCase();return w.map(x=>/^\d/.test(x)?x.replace(/\D.*$/,''):x[0].toUpperCase()).join('').slice(0,4);}

function resumenMes(y,m){
  const fe=fesSet(y),first=idx(y,m,1),n=dm(y,m),nd=nDias(y);
  const esEsp=i=>{if(i<0)return false;if(i>=nd)return(fec(y,nd-1).getUTCDay()===6);const w=fec(y,i).getUTCDay();return w===0||w===6||fe.has(i);};
  // dia siguiente fuera del año: 01/01 siempre festivo
  const esp2=i=>i>=nd?true:esEsp(i);
  let tr=0,noc=0,nocP=0,fin=0,nt=0,n24=false,n31=false,sinH=0;
  for(let d=1;d<=n;d++){
    const i=first+d-1,x=info(pack,i);if(x.tipo!=='T')continue;
    const sg=segs(x.hor);if(!sg.length){if(!esForm(x.c))sinH++;nt++;if(x.horas!=null)tr+=x.horas*60;continue;}nt++;
    let tTot=0,tNoc=0;
    sg.forEach(([a,b])=>{tr+=b-a;tTot+=b-a;
      const cuts=new Set([a,b]);for(let k=Math.floor(a/1440)*1440;k<=b;k+=1440){[k,k+360,k+1320,k+1440].forEach(c=>{if(c>a&&c<b)cuts.add(c);});}
      const L=[...cuts].sort((u,v)=>u-v);
      for(let j=0;j<L.length-1;j++){const u=L[j],v=L[j+1],mid=(u+v)/2,dd=Math.floor(mid/1440),hm=mid-dd*1440,len=v-u;
        if(hm<360||hm>=1320){noc+=len;tNoc+=len;}
        if(esp2(i+dd))fin+=len;
        if(hm>=1320||hm<360){const ni=hm>=1320?i+dd:i+dd-1,f=fec(y,Math.min(Math.max(ni,0),nd-1));if(ni>=0&&ni<nd&&f.getUTCMonth()===11){if(f.getUTCDate()===24)n24=true;if(f.getUTCDate()===31)n31=true;}}
      }});
    nocP+=tNoc>=240?Math.min(tTot,480):tNoc;
  }
  const h=x=>String(Math.round(x/6)/10).replace('.',',');
  return '<div class="card"><h2>Horas de '+MES[m].toLowerCase()+' para tu nómina</h2><div class="lista">'+
    '<div><span>Turnos trabajados</span><b>'+nt+'</b></div>'+
    '<div><span>Horas trabajadas</span><b>'+h(tr)+' h</b></div>'+
    '<div><span>Horas nocturnas (22:00–06:00)</span><b>'+h(noc)+' h</b></div>'+
    '<div><span>Horas de plus de nocturnidad<br><small class="nota">turno con 4 h o más de noche: cuenta el turno entero, máx. 8 h</small></span><b>'+h(nocP)+' h</b></div>'+
    '<div><span>Horas en sábado, domingo o festivo<br><small class="nota">de 00:00 a 24:00 de esos días</small></span><b>'+h(fin)+' h</b></div>'+
    (m===11?'<div><span>Noche del 24 / noche del 31</span><b>'+(n24?'trabajas':'libras')+' / '+(n31?'trabajas':'libras')+'</b></div>':'')+
    '</div>'+(sinH?'<p class="mal" style="margin-top:6px">'+sinH+' turno'+(sinH>1?'s':'')+' sin hora de entrada y salida: cuentan sus horas, pero no las nocturnas ni las de fin de semana. Ponle el horario en «Marcar mis días» → «Mis turnos y horarios».</p>':'')+
    '<p class="nota" style="margin-top:6px">Según el convenio estatal de seguridad (art. 43 g y h; art. 44 b para las noches del 24 y 31). Los turnos que pasan de medianoche se cuentan en el día en que empiezan. Compáralo con los pluses de tu nómina; si tu empresa paga por su propio convenio, las reglas pueden variar.</p></div>';
}

function icsPack(p,alarma){let alEv=0;
  const y=p.y,N=nDias(y),pad=n=>String(n).padStart(2,'0');
  const f=abs=>{const d=new Date(Date.UTC(y,0,1)+abs*60000);return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+'00';};
  const fd=i=>{const d=fec(y,i);return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate());};
  const e=t=>String(t).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
  const fold=l=>{const o=[];while(l.length>66){o.push(l.slice(0,66));l=' '+l.slice(66);}o.push(l);return o.join('\r\n');};
  const st=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'');
  const et=p.et==='definitivo'?'definitivo':'previsión',seq=et==='definitivo'?1:0,mat=p.mat||'x';
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//CCOO Ilunion Seguridad Sevilla//Mi cuadrante//ES','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:'+e('Cuadrante '+y+' · '+et),'X-WR-TIMEZONE:Europe/Madrid'];
  const nota='Cuadrante '+y+' ('+et+'). Revisado por la Sección Sindical de CCOO; contrasta siempre con el cuadrante oficial.';
  const ev=(uid,extra,sum,desc,loc)=>{L.push('BEGIN:VEVENT','UID:'+uid+'@cuadrante.ccoo-ilunion-sevilla','DTSTAMP:'+st+'Z','LAST-MODIFIED:'+st+'Z','SEQUENCE:'+seq);extra.forEach(x=>L.push(x));L.push('SUMMARY:'+e(sum),'DESCRIPTION:'+e(desc));if(loc)L.push('LOCATION:'+e(loc));const am=typeof alarma==='function'?alEv:alarma;if(am>0)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+e(sum),'TRIGGER:-PT'+am+'M','END:VALARM');L.push('END:VEVENT');};
  const bl={V:[],B:[],P:[]};
  for(let i=0;i<N;i++){const x=info(p,i);if(!x.c)continue;
    if(x.tipo==='T'&&x.hor){alEv=typeof alarma==='function'?alarma(i,x):alarma;segs(x.hor).forEach(([a,b],k)=>{const hh=m=>pad(Math.floor(m/60)%24)+':'+pad(m%60);ev(mat+'-'+fd(i)+'-'+k,['DTSTART:'+f(i*DIA+a),'DTEND:'+f(i*DIA+b)],(/^F\d*$/.test(x.c)?'Formación':(x.c==='·'?'Turno':'Turno '+x.c))+' · '+hh(a)+'–'+hh(b),'Código '+x.c+(x.horas!==null?' · '+String(x.horas).replace('.',',')+' h':'')+(x.l?'\nPuesto: '+x.l:'')+'\n'+nota,x.l);});}
    else if(bl[x.tipo])bl[x.tipo].push(i);}
  const nm={V:'Vacaciones',B:'Baja',P:'Permiso / otros'};
  Object.keys(bl).forEach(t=>rangos(bl[t]).forEach(([a,b])=>(alEv=0,ev)(mat+'-'+t+'-'+fd(a),['DTSTART;VALUE=DATE:'+fd(a),'DTEND;VALUE=DATE:'+fd(b+1)],nm[t],(b-a+1)+' días.\n'+nota)));
  L.push('END:VCALENDAR');return L.map(fold).join('\r\n')+'\r\n';
}

async function cargarPDF(f){
  const out=$('fmsg');
  try{
    const buf=new Uint8Array(await f.arrayBuffer());let t='';
    for(let i=0;i<buf.length;i+=65536)t+=String.fromCharCode.apply(null,buf.subarray(i,i+65536));
    const m0=t.match(/MiCuadrante\s*\(([^)]+)\)/),v=m0?m0[1].replace(/\\([0-7]{3})/g,(a,o)=>String.fromCharCode(parseInt(o,8))):'',m=v.match(/^([A-Za-z])\.([A-Za-z0-9_-]+)$/);
    if(!m)throw new Error('Este PDF no lleva los datos de tu cuadrante. Usa el PDF que te ha pasado la Sección Sindical.');
    const p=await decodificar(m[1]+'.'+m[2]);if(importar(p)){cargarActivo();tab='hoy';selDia=-1;window.__msg=null;render();}
  }catch(err){if(out)out.innerHTML='<div class="aviso err">'+esc(err.message)+'</div>';}
}
const normL=x=>x.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const LUG_COD=[['CE','Ciudad Expo'],['CA','Cavaleri'],['JA','San Juan Alto'],['JB','San Juan Bajo'],['A','Ascensor'],['BI','Blas Infante'],['PP','Parque de los Príncipes'],['PC','Plaza de Cuba'],['PJ','Puerta Jerez'],['PS','Prado de San Sebastián'],['SB','San Bernardo'],['NE','Nervión'],['GP','Gran Plaza'],['MA','1º de Mayo'],['AM','Amate'],['LP','La Plata'],['CO','Cocheras'],['PO','Pablo de Olavide'],['CQ','Condequinto'],['MQ','Montequinto'],['EU','Europa'],['OQ','Olivar de Quintos'],['PL','Puesto de Línea'],['B','Búho']];
/* Puestos por servicio. Cada trabajador ve primero los de su servicio (según el cuadrante que cargue)
   y, si escribe, también los de otros servicios por si un día le asignan allí. Añadir servicios aquí
   o incrustarlos en el PDF del trabajador (campo pu: [[código, nombre], ...]). */
const CATALOGO=[{s:'Metro de Sevilla',re:/metro/i,pu:LUG_COD}];
const catPropio=()=>{const c=(pack&&pack.c)||'',out=[];CATALOGO.forEach(k=>{if(k.re.test(c))out.push(...k.pu);});if(pack&&pack.pu)out.push(...pack.pu);return out;};
const catOtros=()=>{const c=(pack&&pack.c)||'',out=[];CATALOGO.forEach(k=>{if(!k.re.test(c))out.push(...k.pu.map(([a,b])=>[a,b+' ('+k.s+')']));});return out;};
const LUG_AB_F=()=>{const m={};catOtros().concat(catPropio()).forEach(([c,n])=>{m[normL(n)]=c;m[normL(n.replace(/\s*\(.*\)$/,''))]=m[normL(n.replace(/\s*\(.*\)$/,''))]||c;});return m;};
function sugLug(q){const qq=normL(q.trim());if(!qq)return[];const AB=LUG_AB_F();
  const prop=[...new Set(lugares().concat(catPropio().map(x=>x[1]),pack&&pack.c?[pack.c]:[]))],otr=catOtros().map(x=>x[1]);
  const sc=x=>{const t=normL(x),cd=AB[t];if(cd&&normL(cd)===qq)return -1;if(t.startsWith(qq))return 0;if(t.split(/[\s\-·(),]+/).some(w=>w.startsWith(qq)))return 1;if(t.includes(qq))return 2;const tc=t.replace(/[^a-z0-9]/g,''),qc=qq.replace(/[^a-z0-9]/g,'');return qc&&tc.includes(qc)?3:9;};
  const a=prop.map(x=>[sc(x),x]),b=otr.filter(x=>!prop.includes(x)).map(x=>[sc(x)+5,x]);
  return a.concat(b).filter(v=>v[0]<9||(v[0]>=4&&v[0]<14)).filter(v=>v[0]!==9).sort((u,v)=>u[0]-v[0]||u[1].localeCompare(v[1])).slice(0,7).map(v=>v[1]);}
function pintaSug(el){let box=el.nextElementSibling;if(!box||!box.classList.contains('sug')){box=document.createElement('div');box.className='sug';el.after(box);}
  const L=sugLug(el.value).filter(x=>x!==el.value);box.innerHTML=L.map(x=>{const cd=LUG_AB_F()[normL(x)];return '<button type="button" data-sug="'+esc(x)+'">'+(cd?'<b class="ab2">'+esc(cd)+'</b> ':'')+esc(x)+'</button>';}).join('');box.hidden=!L.length;}
document.addEventListener('focusout',e=>{if(e.target.dataset&&e.target.dataset.lug){const box=e.target.nextElementSibling;setTimeout(()=>{if(box&&box.classList.contains('sug'))box.hidden=true;},200);}});
document.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-sug]');if(!b)return;e.preventDefault();const box=b.parentElement,inp=box.previousElementSibling;inp.value=b.dataset.sug;if(inp.id==='brl')brushLug=inp.value.trim();box.hidden=true;if(inp.id==='sh-l'&&hoja>=0){setEd(hoja,{l:inp.value.trim()});render();}});
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.lug)pintaSug(e.target);if(e.target.id==='brl')brushLug=e.target.value.trim();if(e.target.id==='pv'){clearTimeout(window.__t);window.__t=setTimeout(comparar,500);}});

async function cargarTexto(txt){
  const m=String(txt).match(/#d=([A-Za-z]\.[A-Za-z0-9_-]+)/);
  if(!m){$('pmsg').innerHTML='<div class="aviso err">No encuentro el enlace en lo que has pegado. Copia el enlace completo del mensaje.</div>';return;}
  try{const p=await decodificar(m[1]);if(importar(p)){cargarActivo();tab='hoy';selDia=-1;window.__msg=null;render();}}
  catch(err){$('pmsg').innerHTML='<div class="aviso err">'+esc(err.message)+'</div>';}
}
async function desdeHash(){
  const h=location.hash;if(!h.startsWith('#d='))return false;
  try{
    const p=await decodificar(h.slice(3));
    if(importar(p)){cargarActivo();tab='hoy';selDia=-1;}
  }catch(err){window.__msg=err.message;}
  history.replaceState(null,'',location.pathname+location.search);
  return true;
}

(async function(){cargarActivo();await desdeHash();render();})();
