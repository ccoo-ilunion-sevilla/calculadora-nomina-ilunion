<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mi cuadrante · CCOO Ilunion Seguridad Sevilla</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14161A">
<link rel="manifest" href="micuadrante.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="mc-favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="mc-apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Mi cuadrante">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--rojo:#CC0000;--rojo-osc:#9E0000;--verde:#009B48;--azul:#25508C;--tinta:#14161A;--tinta-2:#4A5058;--linea:#D4D8DD;--papel:#ECEEF0;--ambar:#B45309}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--papel);color:var(--tinta);line-height:1.45;font-size:15px;padding-bottom:calc(66px + env(safe-area-inset-bottom))}
header{background:var(--tinta);color:#fff;padding:0 0 12px;border-bottom:6px solid var(--rojo)}
.logos{display:block;background:#fff;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;text-align:center;border-bottom:4px solid var(--rojo)}
.logos img{height:46px;width:auto;max-width:100%;vertical-align:middle}
.htxt{padding:10px 16px 0;max-width:760px;margin:0 auto}
/* bloque sindical */
.cta{background:var(--rojo);color:#fff;border-radius:8px;padding:18px 16px;margin:4px 0 12px}
.cta h3{font-family:'Archivo Black',sans-serif;font-size:16px;text-transform:uppercase;line-height:1.1;margin-bottom:8px}
.cta p{font-size:14px;line-height:1.5;margin-bottom:12px}
.cta-btn{display:block;background:#fff;color:var(--rojo);padding:13px 16px;text-decoration:none;font-weight:700;font-size:15px;border-radius:4px;text-align:center;margin-bottom:8px}
.cta-btn.alt{background:transparent;color:#fff;border:2px solid #fff;padding:11px 16px}
.cta-mail{font-size:12px;margin:10px 0 0!important}
.cta-mail button{display:block;background:transparent;border:0;border-bottom:1px dotted #fff;color:#fff;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:12px;padding:2px 0;margin-top:4px}
.afi{background:var(--tinta);color:#fff;border-radius:8px;border-top:8px solid var(--rojo);padding:24px 18px 26px;margin-bottom:12px}
.afi-eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:#8C949E;font-weight:700;margin-bottom:10px}
.afi h3{font-family:'Archivo Black',sans-serif;font-size:clamp(26px,8vw,38px);line-height:.95;text-transform:uppercase;letter-spacing:-.02em;margin-bottom:12px}
.afi h3 em{font-style:normal;color:var(--rojo)}
.afi-txt{font-size:14px;line-height:1.6;color:#C8CDD4;margin-bottom:18px}
.afi-btn{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--rojo);color:#fff;text-decoration:none;padding:17px 18px;border-radius:4px;font-family:'Archivo Black',sans-serif;font-size:clamp(15px,4.4vw,18px);text-transform:uppercase;letter-spacing:.05em;box-shadow:0 6px 0 var(--rojo-osc)}
.afi-btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--rojo-osc)}
.afi-pie{font-size:11px;color:#8C949E;margin-top:14px;line-height:1.5}
.herr{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--linea);border-radius:8px;padding:12px 14px;margin-bottom:12px;text-decoration:none;color:var(--tinta)}
.herr b{display:block;font-size:14px}.herr small{color:var(--tinta-2);font-size:12.5px}.herr .fl{margin-left:auto;color:var(--rojo);font-size:20px}
header h1{font-family:'Archivo Black',sans-serif;font-size:19px;text-transform:uppercase;line-height:1.05}
header h1 em{color:var(--rojo);font-style:normal}
header .sub{font-size:12.5px;color:#A8B0BA;margin-top:3px}
.chip{display:inline-block;border-radius:99px;padding:1px 9px;font-size:11px;font-weight:700;background:var(--azul);color:#fff;margin-left:6px;vertical-align:1px}
.chip.def{background:var(--verde)}
main{max-width:760px;margin:0 auto;padding:14px 14px 20px}
.oculto{display:none!important}
.card{background:#fff;border:1px solid var(--linea);border-radius:8px;padding:14px;margin-bottom:12px}
.card h2{font-family:'Archivo Black',sans-serif;font-size:13px;text-transform:uppercase;margin-bottom:8px}
.nota{font-size:12.5px;color:var(--tinta-2)}
.btn{background:#fff;border:1px solid var(--tinta);border-radius:6px;padding:10px 14px;font-weight:700;font-size:14px;font-family:inherit;cursor:pointer;touch-action:manipulation}
.btn.pri{background:var(--rojo);border-color:var(--rojo);color:#fff}
.btn.wa{background:#1FA855;border-color:#1FA855;color:#fff}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--tinta);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tabs button{flex:1;background:none;border:0;color:#A8B0BA;font:600 11.5px 'Inter',sans-serif;padding:9px 2px 8px;cursor:pointer;border-top:3px solid transparent}
.tabs button[aria-selected="true"]{color:#fff;border-top-color:var(--rojo)}
.tabs button b{display:block;font-size:17px;line-height:1.1}
.hoy{display:flex;align-items:center;gap:14px}
.hoy .cod{font-family:'Archivo Black',sans-serif;font-size:34px;min-width:64px;text-align:center;border-radius:8px;padding:6px 8px}
.hoy .hh{font-size:19px;font-weight:700}
.t{background:#DCEBFA}.t.m{background:#F0F7FF}.n{background:#C9C6EE}.l{background:#FFF1E6;color:#B4583A}
.anio td.yl{color:#B4583A;font-weight:700}.anio td.yl:not(.fin):not(.fes){background:#FFF1E6}.v{background:#CDEFD8}.b{background:#FDE9B8}.x{background:#FFB3B3}
.lista div{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--linea);font-size:14px}
.lista div:last-child{border:0}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mnav b{font-family:'Archivo Black',sans-serif;text-transform:uppercase;font-size:15px}
.mnav button{background:#fff;border:1px solid var(--linea);border-radius:6px;width:42px;height:38px;font-size:18px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.grid .dh{font-size:11px;font-weight:700;text-align:center;color:var(--tinta-2)}
.dia{border-radius:6px;min-height:58px;padding:3px 2px 2px;text-align:center;font-size:11px;border:2px solid transparent;cursor:pointer;position:relative;overflow:hidden}
.dia .num{font-size:10px;color:#555;text-align:left;padding-left:3px;line-height:1}
.dia .c{font-weight:800;font-size:15px;line-height:1.15}
.dia .c .ab{font-size:10px;font-weight:800;color:#fff;background:#1F4E8C;border-radius:4px;padding:1px 3px;vertical-align:2px}
.dia .c.lib{font-weight:700;font-size:11px;color:#B4583A;margin-top:3px}
.dia .h{font-size:8.5px;line-height:1.1;color:#333}
.dia.fes .num{color:var(--rojo);font-weight:800}
.dia.fin{box-shadow:inset 0 -3px 0 #9aa0a8}
.dia.hoyd{border-color:var(--tinta)}
.dia.fallo{border-color:var(--rojo)}
.dia.cambio::after{content:'';position:absolute;top:2px;right:2px;width:9px;height:9px;border-radius:50%;background:#F2B400}
.dia.ped{outline:2px dashed var(--azul);outline-offset:-2px}
.dia.sel{border-color:#000;background-image:linear-gradient(#FFF17655,#FFF17655)}
.det{margin-top:10px;border:1px solid var(--linea);border-radius:8px;padding:10px 12px;background:#FAFAFA;font-size:14px}
.anio{overflow-x:auto;border:1px solid var(--linea);border-radius:6px;background:#fff}
.anio table{border-collapse:collapse;font-size:10px;min-width:760px;width:100%}
.anio td,.anio th{border:1px solid #bbb;text-align:center;padding:2px 0;min-width:21px;height:19px}
.anio th{background:#f3f4f6;font-weight:600}
.anio td.m{text-align:left;font-weight:700;min-width:36px;background:#f3f4f6;padding-left:4px}
.anio td.fin{background:#d6d6d6;font-weight:700}.anio td.fes{background:#b5b5b5}
.anio td.fallo{outline:2px solid var(--rojo);outline-offset:-2px;font-weight:700}
.anio td.cambio{background:#FFE58A}
.meses{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.mm{background:#fff;border:1px solid var(--linea);border-radius:8px;padding:6px}
.mm h3{margin:0 0 4px;font-size:13px;display:flex;justify-content:space-between}.mm h3 small{font-weight:400;color:#666}
.mm .g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mm .wd{font-size:9px;text-align:center;color:#666}.mm .wd.we{color:var(--rojo)}
.mm .c2{position:relative;border:1px solid #ccc;border-radius:3px;min-height:27px;font-size:10px;font-weight:700;text-align:center;line-height:1.05;padding-top:9px;overflow:hidden;cursor:pointer}
.mm .c2 i{position:absolute;top:1px;left:2px;font-style:normal;font-size:7.5px;font-weight:400;color:#555}
.mm .c2.fes i{color:var(--rojo);font-weight:700}
.mm .c2.l{font-size:7px;letter-spacing:-.2px;padding-top:11px}.mm .c2.fsl{border:2px solid var(--rojo)}
.mm .c2.fallo{outline:2px solid var(--rojo);outline-offset:-3px}.mm .c2.cambio{box-shadow:inset 0 0 0 3px #F2B400}
.mm .c2.ed::after{content:'✎';position:absolute;top:0;right:2px;font-size:8px;color:var(--azul)}
.mm .c2 b{display:block;font-size:7px;font-weight:600;color:#2a4d7a}
.sev{display:inline-block;border-radius:3px;padding:0 6px;font-size:11px;font-weight:800;color:#fff;margin-right:4px}
.sev.e{background:var(--rojo)}.sev.a{background:var(--ambar)}
.fallo-c{border:1px solid var(--linea);border-left:5px solid var(--ambar);border-radius:6px;padding:9px 11px;margin-bottom:8px;font-size:13.5px}
.fallo-c.e{border-left-color:var(--rojo)}
.fallo-c .nm{font-size:11.5px;color:var(--tinta-2);margin-top:4px}
textarea,input[type=text],input[type=number],select{width:100%;padding:10px;border:1px solid var(--linea);border-radius:6px;font:inherit;font-size:15px;background:#fff}
textarea{min-height:64px;resize:vertical}
label{display:block;font-size:12.5px;font-weight:600;margin:8px 0 4px}
.ok{color:var(--verde);font-weight:700}.mal{color:var(--rojo);font-weight:700}
.aviso{border-left:4px solid var(--ambar);background:#FFF8EC;padding:9px 12px;border-radius:4px;font-size:13px;margin:8px 0}
.aviso.err{border-color:var(--rojo);background:#FFF0F0}.aviso.okk{border-color:var(--verde);background:#EFFAF3}
table.h{width:100%;border-collapse:collapse;font-size:12.5px}
table.h td,table.h th{padding:5px 6px;border-bottom:1px solid var(--linea);text-align:right}
table.h td:first-child,table.h th:first-child{text-align:left}
table.h td.bad{background:#FFD9D9;font-weight:700}
.bienv{text-align:center;padding:30px 10px}
.bienv h2{font-size:17px;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chp{border:1px solid var(--linea);border-radius:99px;padding:7px 11px;font:600 13px 'Inter',sans-serif;background:#fff;cursor:pointer}
.chp[aria-pressed="true"]{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.dia .lg{font-size:8px;color:#444;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
.dia.ed::before{content:'✎';position:absolute;bottom:1px;right:3px;font-size:9px;color:var(--azul)}
.fila2{display:flex;gap:8px}.fila2>*{flex:1}
.sug{display:flex;flex-direction:column;border:1px solid var(--linea);border-radius:8px;margin-top:2px;background:#fff;overflow:hidden;box-shadow:0 4px 12px #0001}.sug button{all:unset;padding:11px 12px;font-size:15px;border-bottom:1px solid var(--linea);cursor:pointer}.sug button:last-child{border-bottom:0}.sug button:hover{background:#F0F7FF}
.sheet-bg{position:fixed;inset:0;background:#0007;z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fd .15s}
.sheet{background:#fff;width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px #0003;animation:up .2s ease-out}
.sheet .det{background:#fff;border:0;padding:4px 0;font-size:16px}.sh-asa{width:42px;height:5px;border-radius:3px;background:#ccc;margin:0 auto 8px}
.sh-sec{border-top:1px solid var(--linea);margin-top:12px;padding-top:12px}
.sheet .ab2{display:inline-block;font-size:11px;color:#fff;background:#1F4E8C;border-radius:4px;padding:1px 4px;margin-left:4px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}@keyframes fd{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet,.sheet-bg{animation:none}}.sug .ab2{display:inline-block;min-width:26px;font-size:11px;color:#fff;background:#1F4E8C;border-radius:4px;padding:1px 4px;text-align:center;margin-right:6px}
.trow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--linea)}.trow:last-child{border-bottom:0}
footer{font-size:11.5px;color:var(--tinta-2);text-align:center;padding:6px 16px 20px;line-height:1.6}footer a{color:var(--rojo)}
</style>
</head>

function icsPack(p,alarma){
  const y=p.y,N=nDias(y),pad=n=>String(n).padStart(2,'0');
  const f=abs=>{const d=new Date(Date.UTC(y,0,1)+abs*60000);return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+'00';};
  const fd=i=>{const d=fec(y,i);return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate());};
  const e=t=>String(t).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
  const fold=l=>{const o=[];while(l.length>66){o.push(l.slice(0,66));l=' '+l.slice(66);}o.push(l);return o.join('\r\n');};
  const st=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'');
  const et=p.et==='definitivo'?'definitivo':'previsión',seq=et==='definitivo'?1:0,mat=p.mat||'x';
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//CCOO Ilunion Seguridad Sevilla//Mi cuadrante//ES','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:'+e('Cuadrante '+y+' · '+et),'X-WR-TIMEZONE:Europe/Madrid'];
  const nota='Cuadrante '+y+' ('+et+'). Revisado por la Sección Sindical de CCOO; contrasta siempre con el cuadrante oficial.';
  const ev=(uid,extra,sum,desc,loc)=>{L.push('BEGIN:VEVENT','UID:'+uid+'@cuadrante.ccoo-ilunion-sevilla','DTSTAMP:'+st+'Z','LAST-MODIFIED:'+st+'Z','SEQUENCE:'+seq);extra.forEach(x=>L.push(x));L.push('SUMMARY:'+e(sum),'DESCRIPTION:'+e(desc));if(loc)L.push('LOCATION:'+e(loc));if(alarma>0)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+e(sum),'TRIGGER:-PT'+alarma+'M','END:VALARM');L.push('END:VEVENT');};
  const bl={V:[],B:[],P:[]};
  for(let i=0;i<N;i++){const x=info(p,i);if(!x.c)continue;
    if(x.tipo==='T'&&x.hor){segs(x.hor).forEach(([a,b],k)=>{const hh=m=>pad(Math.floor(m/60)%24)+':'+pad(m%60);ev(mat+'-'+fd(i)+'-'+k,['DTSTART:'+f(i*DIA+a),'DTEND:'+f(i*DIA+b)],(/^F\d*$/.test(x.c)?'Formación':(x.c==='·'?'Turno':'Turno '+x.c))+' · '+hh(a)+'–'+hh(b),'Código '+x.c+(x.horas!==null?' · '+String(x.horas).replace('.',',')+' h':'')+(x.l?'\nPuesto: '+x.l:'')+'\n'+nota,x.l);});}
    else if(bl[x.tipo])bl[x.tipo].push(i);}
  const nm={V:'Vacaciones',B:'Baja',P:'Permiso / otros'};
  Object.keys(bl).forEach(t=>rangos(bl[t]).forEach(([a,b])=>ev(mat+'-'+t+'-'+fd(a),['DTSTART;VALUE=DATE:'+fd(a),'DTEND;VALUE=DATE:'+fd(b+1)],nm[t],(b-a+1)+' días.\n'+nota)));
  L.push('END:VCALENDAR');return L.map(fold).join('\r\n')+'\r\n';
}

  const L=sugLug(el.value).filter(x=>x!==el.value);box.innerHTML=L.map(x=>{const cd=LUG_AB_F()[normL(x)];return '<button type="button" data-sug="'+esc(x)+'">'+(cd?'<b class="ab2">'+esc(cd)+'</b> ':'')+esc(x)+'</button>';}).join('');box.hidden=!L.length;}
document.addEventListener('focusout',e=>{if(e.target.dataset&&e.target.dataset.lug){const box=e.target.nextElementSibling;setTimeout(()=>{if(box&&box.classList.contains('sug'))box.hidden=true;},200);}});
document.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-sug]');if(!b)return;e.preventDefault();const box=b.parentElement,inp=box.previousElementSibling;inp.value=b.dataset.sug;if(inp.id==='brl')brushLug=inp.value.trim();box.hidden=true;if(inp.id==='sh-l'&&hoja>=0){setEd(hoja,{l:inp.value.trim()});render();}});
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.lug)pintaSug(e.target);if(e.target.id==='brl')brushLug=e.target.value.trim();if(e.target.id==='pv'){clearTimeout(window.__t);window.__t=setTimeout(comparar,500);}});

async function cargarTexto(txt){
  const m=String(txt).match(/#d=([A-Za-z]\.[A-Za-z0-9_-]+)/);
  if(!m){$('pmsg').innerHTML='<div class="aviso err">No encuentro el enlace en lo que has pegado. Copia el enlace completo del mensaje.</div>';return;}
  try{const p=await decodificar(m[1]);if(importar(p)){cargarActivo();tab='hoy';selDia=-1;window.__msg=null;render();}}
  catch(err){$('pmsg').innerHTML='<div class="aviso err">'+esc(err.message)+'</div>';}
}
async function desdeHash(){
  const h=location.hash;if(!h.startsWith('#d='))return false;
  try{
    const p=await decodificar(h.slice(3));
    if(importar(p)){cargarActivo();tab='hoy';selDia=-1;}
  }catch(err){window.__msg=err.message;}
  history.replaceState(null,'',location.pathname+location.search);
  return true;
}
window.addEventListener('hashchange',async()=>{if(await desdeHash())render();});
(async function(){cargarActivo();await desdeHash();render();})();
})();
</script>
