<style>

.btn{background:#fff;border:1px solid var(--tinta);border-radius:6px;padding:10px 14px;font-weight:700;font-size:14px;font-family:inherit;cursor:pointer;touch-action:manipulation}

.det{margin-top:10px;border:1px solid var(--linea);border-radius:8px;padding:10px 12px;background:#FAFAFA;font-size:14px}

textarea,input[type=text],input[type=number],select{width:100%;padding:10px;border:1px solid var(--linea);border-radius:6px;font:inherit;font-size:15px;background:#fff}

label{display:block;font-size:12.5px;font-weight:600;margin:8px 0 4px}

.fila2{display:flex;gap:8px}.fila2>*{flex:1}
footer{font-size:11.5px;color:var(--tinta-2);text-align:center;padding:6px 16px 20px}

<body>
<header>
  <h1>Mi <em>cuadrante</em></h1>

<main id="app"></main>
<nav class="tabs oculto" id="tabs" role="tablist">
  <button data-t="hoy" aria-selected="true"><b>⏱</b>Hoy</button>

<footer>Herramienta de apoyo de la Sección Sindical de CCOO. Tus datos se guardan solo en este móvil. Contrasta siempre con el cuadrante oficial.</footer>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='mc_v1',DIA=1440;
const MES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DS=['dom','lun','mar','mié','jue','vie','sáb'],DL=['L','M','X','J','V','S','D'];
let store={packs:{},pet:{},ultimo:null,ed:{},pal:{},lug:{}},pack=null,prev=null,tab='hoy',mes=0,selDia=-1,verCambios=false,edit=false,brush=null,brushLug='',nuevoT=false;
try{store=Object.assign(store,JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(e){}
store.ed=store.ed||{};store.pal=store.pal||{};store.lug=store.lug||{};
const guardar=()=>{try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}};

/* ---------- fechas ---------- */
const nDias=y=>((y%4===0&&y%100!==0)||y%400===0)?366:365;
const dm=(y,m)=>[31,nDias(y)===366?29:28,31,30,31,30,31,31,30,31,30,31][m];
const fec=(y,i)=>new Date(Date.UTC(y,0,1+i));
const idx=(y,m,d)=>Math.round((Date.UTC(y,m,d)-Date.UTC(y,0,1))/864e5);
const fmt=(y,i)=>{const d=fec(y,i);return DS[d.getUTCDay()]+' '+String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0');};
const corto=(y,i)=>fmt(y,i).slice(4);
const hoyIdx=y=>{const n=new Date();return n.getFullYear()===y?idx(y,n.getMonth(),n.getDate()):-1;};

/* ---------- decodificación del enlace ---------- */
const b64u=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;};
async function decodificar(s){
  const tag=s.slice(0,2),bytes=b64u(s.slice(2));
  if(tag==='z.'){
    if(typeof DecompressionStream==='undefined')throw new Error('Tu navegador es muy antiguo para abrir este enlace. Actualízalo o ábrelo con Chrome/Safari recientes.');
    const buf=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
    return JSON.parse(new TextDecoder().decode(buf));
  }
  if(tag==='j.')return JSON.parse(new TextDecoder().decode(bytes));
  throw new Error('Enlace no válido.');
}
const firma=p=>p.et+'|'+p.D.join(',');
function importar(p){
  if(!p||p.v!==1||!Array.isArray(p.D)||!p.y)throw new Error('El enlace no tiene el formato esperado.');
  const act=store.packs[p.y]&&store.packs[p.y].actual;
  if(act&&act.mat&&p.mat&&act.mat!==p.mat&&!confirm('Este enlace es de otro trabajador (nº '+p.mat+') y en este móvil tienes guardado el nº '+act.mat+'. ¿Sustituirlo?'))return false;
  const e=store.packs[p.y]||{};
  if(p.ms&&act&&act.y===p.y){ // actualización de uno o varios meses: se fusiona con lo que ya tiene
    const m2=JSON.parse(JSON.stringify(act));
    p.ms.forEach(m=>{for(let d=1;d<=dm(p.y,m);d++){const i=idx(p.y,m,d);m2.D[i]=p.D[i]||'';}m2.Hm[m]=p.Hm[m];});
    m2.L=Object.assign({},act.L,p.L);
    m2.F=(act.F||[]).filter(f=>!(f[4]||[]).length||!p.ms.includes(fec(p.y,f[4][0]).getUTCMonth())).concat(p.F||[]);
    m2.Tt=Math.round(m2.Hm.reduce((a,b)=>a+b,0)*100)/100;m2.et=p.et;m2.f=p.f;m2.fe=p.fe&&p.fe.length?p.fe:m2.fe;m2.tel=p.tel||m2.tel;
    p=m2;
  }
  if(act&&firma(act)!==firma(p))e.previa=act;
  e.actual=p;store.packs[p.y]=e;store.ultimo=p.y;guardar();return true;
}
function cargarActivo(){
  const y=store.ultimo,e=y&&store.packs[y];
  pack=e?e.actual:null;prev=e?e.previa||null:null;
  if(pack){const h=hoyIdx(pack.y);mes=(h>=0&&h<nDias(pack.y))?fec(pack.y,h).getUTCMonth():0;}
}

/* ---------- información de un día ---------- */
const legG=(p,c)=>p.L[c]||store.pal[c]||null;
function info(p,i,raw){
  let c=(p.D[i]||'').trim();const o=(!raw&&p===pack&&store.ed[p.y]&&store.ed[p.y][i])||null;
  if(o&&o.c!==undefined&&o.c!=='')c=o.c==='-'?'':o.c;
  const g=c?legG(p,c):null;let tipo=!c?'L':(g?g[0]:'?'),hor=g?g[1]:'',horas=g?g[2]:null;
  if(o&&o.h){tipo='T';hor=o.h;const sg=segs(o.h);horas=sg.length?Math.round(sg.reduce((a,x)=>a+x[1]-x[0],0)/6)/10:null;if(!c)c='·';}
  const l=(o&&o.l)||(c&&(store.lug[c]||(p.lg&&p.lg[c])))||'';
  return{c,tipo,hor,horas,l,ed:!!o,n:(o&&o.n)||''};
}
const minu=h=>{const m=h.match(/^(\d{2}):(\d{2})$/);return m?(+m[1])*60+(+m[2]):null;};
function segs(hor){
  if(!hor)return[];let prev=-1;const out=[];
  hor.split('+').forEach(p=>{const m=p.split('-');let a=minu(m[0]),b=minu(m[1]);if(a===null||b===null)return;if(a<prev)a+=DIA;if(b<=a)b+=DIA;out.push([a,b]);prev=b;});
  return out;
}
const esNoche=hor=>{const s=segs(hor);if(!s.length)return false;const a=s[0][0]%DIA;return a>=1140||a<360;};
const cls=(i)=>{const x=info(pack,i);if(x.tipo==='L')return'l';if(x.tipo==='V')return'v';if(x.tipo==='B'||x.tipo==='P')return'b';if(x.tipo==='?')return'x';return esNoche(x.hor)?'n':'t';};
const horTxt=hor=>hor.split('+').map(s=>s.replace('-','–')).join(' + ');
const nombreTipo={T:'Turno',L:'Libre',V:'Vacaciones',B:'Baja',P:'Permiso / otros','?':'Código sin definir'};
const descDia=(p,i)=>{const x=info(p,i);return x.tipo==='T'?(x.c==='·'?'Turno propio':'Turno '+x.c)+' · '+horTxt(x.hor)+(x.horas!==null?' ('+String(x.horas).replace('.',',')+' h)':''):(x.c?(nombreTipo[x.tipo]||x.tipo)+' ('+x.c+')':'Libre');};

const txtDia=(i,raw)=>{const r=info(pack,i,raw);return r.tipo==='T'?(r.c==='·'?'Turno propio':'Turno '+r.c)+' · '+horTxt(r.hor):(r.c?(nombreTipo[r.tipo]||r.tipo)+' ('+r.c+')':'Libre');};
const propio=()=>pack.et==='propio';
function hmMes(){if(!propio())return pack.Hm;const a=Array(12).fill(0);for(let i=0;i<nDias(pack.y);i++){const x=info(pack,i);if(x.tipo==='T'&&x.horas)a[fec(pack.y,i).getUTCMonth()]+=x.horas;}return a.map(v=>Math.round(v*100)/100);}
const totalH=()=>propio()?Math.round(hmMes().reduce((a,b)=>a+b,0)*100)/100:pack.Tt;
const lugares=()=>{const s=new Set(Object.values(store.lug).filter(Boolean));Object.values(store.ed).forEach(m=>Object.values(m).forEach(o=>{if(o.l)s.add(o.l);}));Object.values(store.pal).forEach(g=>{if(g[3])s.add(g[3]);});return[...s].sort();};
/* ---------- conjuntos marcados ---------- */
const diasFallo=()=>{const s=new Set();(pack.F||[]).forEach(f=>(f[4]||[]).forEach(d=>s.add(d)));return s;};
function cambios(){
  if(!prev||prev.y!==pack.y)return[];
  const out=[];for(let i=0;i<nDias(pack.y);i++){if((prev.D[i]||'')!==(pack.D[i]||''))out.push(i);}return out;
}
const diasCambio=()=>new Set(cambios());
function parseRangos(txt,y){
  const dias=new Set(),err=[],F='(\\d{1,2})[\\/.](\\d{1,2})(?:[\\/.]\\d{2,4})?';
  const re=new RegExp('^'+F+'(?:\\s*(?:-|–|a|al|hasta)\\s*'+F+')?$','i');
  String(txt||'').split(/[\n;,]+/).map(x=>x.trim()).filter(Boolean).forEach(tok=>{
    const m=tok.match(re);if(!m){err.push('«'+tok+'»: formato no válido (ej.: 15/07-31/07 o 24/12)');return;}
    const d1=+m[1],m1=+m[2]-1,d2=m[3]?+m[3]:d1,m2=m[4]?+m[4]-1:m1,ok=(d,mm)=>mm>=0&&mm<12&&d>=1&&d<=dm(y,mm);
    if(!ok(d1,m1)||!ok(d2,m2)){err.push('«'+tok+'»: fecha inexistente');return;}
    const a=idx(y,m1,d1),b=idx(y,m2,d2);if(b<a){err.push('«'+tok+'»: el final es anterior al inicio');return;}
    for(let i=a;i<=b;i++)dias.add(i);
  });
  return{dias,err};
}
const rangos=arr=>{const a=[...arr].sort((p,q)=>p-q),o=[];a.forEach(i=>{const l=o[o.length-1];if(l&&i===l[1]+1)l[1]=i;else o.push([i,i]);});return o;};
const rg=(y,[a,b])=>a===b?corto(y,a):corto(y,a)+' → '+corto(y,b);

/* ---------- vistas ---------- */
function cab(){
  if(!pack){$('cab').textContent='CCOO · Ilunion Seguridad Sevilla';return;}
  $('cab').innerHTML=esc(pack.n||'')+(pack.n?' · ':'')+'Nº '+esc(pack.mat||'—')+' · '+pack.y+'<span class="chip '+(pack.et==='definitivo'?'def':'')+'">'+esc(pack.et)+'</span>';
}
const cajaPegar=()=>'<div class="card"><h2>Cargar mi enlace</h2><p class="nota">Copia el enlace del mensaje de WhatsApp (o el mensaje entero) y pégalo aquí. Sirve si abriste el enlace en otro navegador o si instalaste la app y la ves vacía.</p><textarea id="pega" placeholder="Pega aquí el enlace…"></textarea><p style="margin-top:8px"><button class="btn pri" id="bpega">Cargar</button></p><div id="pmsg"></div></div>';
function vBienvenida(msg){
  return '<div class="card bienv"><h2>Mi cuadrante</h2><p>'+(msg?esc(msg):'Abre el <b>enlace personal</b> que te ha enviado la Sección Sindical por WhatsApp y verás tu cuadrante, los fallos que hemos detectado y podrás comprobar tus vacaciones.')+'</p></div>'+cajaPegar()+'<div class="card"><h2>¿Sin enlace?</h2><p class="nota">Puedes usar la app sola: marca tus días de trabajo, tus turnos y tus lugares, y llévalo a tu calendario.</p><p style="margin-top:8px"><button class="btn" data-vacio="'+new Date().getFullYear()+'">Empezar mi calendario '+new Date().getFullYear()+'</button> <button class="btn" data-vacio="'+(new Date().getFullYear()+1)+'">Empezar el '+(new Date().getFullYear()+1)+'</button></p></div>';
}
function proximos(n){
  const y=pack.y,N=nDias(y),h=hoyIdx(y),ahora=new Date(),ahoraMin=ahora.getHours()*60+ahora.getMinutes();
  const out=[];for(let i=Math.max(0,h<0?0:h);i<N&&out.length<n;i++){
    const x=info(pack,i);if(x.tipo!=='T'||!x.hor)continue;
    const s=segs(x.hor);const fin=i===h?s[s.length-1][1]:0;
    if(i===h&&fin<=ahoraMin)continue;out.push(i);
  }return out;
}
function vHoy(){
  const y=pack.y,N=nDias(y),h=hoyIdx(y);let html='';
  if(h>=0&&h<N){
    const x=info(pack,h);
    html+='<div class="card"><h2>Hoy · '+fmt(y,h)+'</h2><div class="hoy"><div class="cod '+cls(h)+'">'+esc(x.c||'—')+'</div><div><div class="hh">'+(x.tipo==='T'?esc(horTxt(x.hor)):esc(nombreTipo[x.tipo]||'Libre'))+'</div><div class="nota">'+esc(descDia(pack,h))+'</div></div></div></div>';
  }else html+='<div class="aviso">Tu cuadrante es del año <b>'+y+'</b>. Hoy no está dentro de ese año.</div>';
  const px=proximos(6);

function icsPack(p,alarma){
  const y=p.y,N=nDias(y),pad=n=>String(n).padStart(2,'0');
  const f=abs=>{const d=new Date(Date.UTC(y,0,1)+abs*60000);return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+'00';};
  const fd=i=>{const d=fec(y,i);return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate());};
  const e=t=>String(t).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
  const fold=l=>{const o=[];while(l.length>66){o.push(l.slice(0,66));l=' '+l.slice(66);}o.push(l);return o.join('\r\n');};
  const st=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'');
  const et=p.et==='definitivo'?'definitivo':'previsión',seq=et==='definitivo'?1:0,mat=p.mat||'x';
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//CCOO Ilunion Seguridad Sevilla//Mi cuadrante//ES','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:'+e('Cuadrante '+y+' · '+et),'X-WR-TIMEZONE:Europe/Madrid'];
  const nota='Cuadrante '+y+' ('+et+'). Revisado por la Sección Sindical de CCOO; contrasta siempre con el cuadrante oficial.';
  const ev=(uid,extra,sum,desc,loc)=>{L.push('BEGIN:VEVENT','UID:'+uid+'@cuadrante.ccoo-ilunion-sevilla','DTSTAMP:'+st+'Z','LAST-MODIFIED:'+st+'Z','SEQUENCE:'+seq);extra.forEach(x=>L.push(x));L.push('SUMMARY:'+e(sum),'DESCRIPTION:'+e(desc));if(loc)L.push('LOCATION:'+e(loc));if(alarma>0)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+e(sum),'TRIGGER:-PT'+alarma+'M','END:VALARM');L.push('END:VEVENT');};
  const bl={V:[],B:[],P:[]};
  for(let i=0;i<N;i++){const x=info(p,i);if(!x.c)continue;
    if(x.tipo==='T'&&x.hor){segs(x.hor).forEach(([a,b],k)=>{const hh=m=>pad(Math.floor(m/60)%24)+':'+pad(m%60);ev(mat+'-'+fd(i)+'-'+k,['DTSTART:'+f(i*DIA+a),'DTEND:'+f(i*DIA+b)],(/^F\d*$/.test(x.c)?'Formación':(x.c==='·'?'Turno':'Turno '+x.c))+' · '+hh(a)+'–'+hh(b),'Código '+x.c+(x.horas!==null?' · '+String(x.horas).replace('.',',')+' h':'')+(x.l?'\nLugar: '+x.l:'')+'\n'+nota,x.l);});}
    else if(bl[x.tipo])bl[x.tipo].push(i);}
  const nm={V:'Vacaciones',B:'Baja',P:'Permiso / otros'};
  Object.keys(bl).forEach(t=>rangos(bl[t]).forEach(([a,b])=>ev(mat+'-'+t+'-'+fd(a),['DTSTART;VALUE=DATE:'+fd(a),'DTEND;VALUE=DATE:'+fd(b+1)],nm[t],(b-a+1)+' días.\n'+nota)));
  L.push('END:VCALENDAR');return L.map(fold).join('\r\n')+'\r\n';
}

    const c=($('nt-c').value||'').trim().toUpperCase(),a=$('nt-e').value,b=$('nt-s').value;
    if(!c||!a||!b){alert('Pon un nombre y las horas de entrada y salida.');return;}
    const sg=segs(a+'-'+b),hs=sg.length?Math.round(sg.reduce((x,y)=>x+y[1]-y[0],0)/6)/10:null,l=($('nt-l').value||'').trim();
    store.pal[c]=['T',a+'-'+b,hs,l];if(l)store.lug[c]=l;guardar();brush=c;nuevoT=false;render();return;}
  const d=e.target.closest('.dia');
  if(d){
    const i=+d.dataset.i;
    if(edit&&brush){const v={c:brush,l:brushLug};if(brush==='V'&&!legG(pack,'V'))store.pal.V=['V','',null];setEd(i,v);selDia=i;render();return;}
    selDia=i;render();return;}
  if(e.target.closest('[data-gd]')){
    const i=selDia,c=$('ed-c').value,a=$('ed-e').value,b=$('ed-s').value;
    if(c==='V'&&!legG(pack,'V'))store.pal.V=['V','',null];
    setEd(i,{c:c||undefined,h:(a&&b)?a+'-'+b:undefined,l:$('ed-l').value.trim(),n:$('ed-n').value.trim()});
    const o=(store.ed[pack.y]||{})[i];if(o&&!c){delete o.c;guardar();}
    render();return;}
  if(e.target.closest('[data-qd]')){if(store.ed[pack.y])delete store.ed[pack.y][selDia];guardar();render();return;}
  const vc=e.target.closest('[data-vacio]');if(vc){
    const y=+vc.dataset.vacio,n=nDias(y);
    store.packs[y]={actual:{v:1,y,mat:'',n:'',c:'',et:'propio',f:new Date().toISOString().slice(0,10),L:{},D:Array(n).fill(''),F:[],Hm:Array(12).fill(0),Tt:0,Tw:0,vm:31,rg:[144,176,134,162],red:true,fe:[],tel:''}};
    store.ultimo=y;guardar();cargarActivo();tab='mes';edit=true;render();return;}
  const go=e.target.closest('[data-go]');if(go){selDia=+go.dataset.i;mes=fec(pack.y,selDia).getUTCMonth();tab='mes';render();return;}
  const v=e.target.closest('[data-ver]');if(v){const f=pack.F[+v.dataset.ver],d0=(f[4]||[])[0];if(d0!==undefined){selDia=d0;mes=fec(pack.y,d0).getUTCMonth();tab='mes';render();window.scrollTo(0,0);}return;}
  if(e.target.id==='bpega'){cargarTexto($('pega').value);return;}
  if(e.target.id==='bics'){
    const txt=icsPack(pack,+$('al').value),a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([txt],{type:'text/calendar;charset=utf-8'}));
    a.download='cuadrante_'+pack.y+'_'+(pack.et==='definitivo'?'definitivo':'prevision')+'.ics';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  }
});
document.addEventListener('change',e=>{if(e.target.id==='pv')comparar();});
document.addEventListener('input',e=>{if(e.target.id==='brl')brushLug=e.target.value.trim();if(e.target.id==='pv'){clearTimeout(window.__t);window.__t=setTimeout(comparar,500);}});

async function cargarTexto(txt){
  const m=String(txt).match(/#d=([A-Za-z]\.[A-Za-z0-9_-]+)/);
  if(!m){$('pmsg').innerHTML='<div class="aviso err">No encuentro el enlace en lo que has pegado. Copia el enlace completo del mensaje.</div>';return;}
  try{const p=await decodificar(m[1]);if(importar(p)){cargarActivo();tab='hoy';selDia=-1;window.__msg=null;render();}}
  catch(err){$('pmsg').innerHTML='<div class="aviso err">'+esc(err.message)+'</div>';}
}
async function desdeHash(){
  const h=location.hash;if(!h.startsWith('#d='))return false;
  try{
    const p=await decodificar(h.slice(3));
    if(importar(p)){cargarActivo();tab='hoy';selDia=-1;}
  }catch(err){window.__msg=err.message;}
  history.replaceState(null,'',location.pathname+location.search);
  return true;
}
window.addEventListener('hashchange',async()=>{if(await desdeHash())render();});
(async function(){cargarActivo();await desdeHash();render();})();
})();
</script>
